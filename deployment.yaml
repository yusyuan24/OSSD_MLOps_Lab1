apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: iris-api}
  template:
    metadata:
      labels: {app: iris-api}
    spec:
      containers:
      - name: api
        image: iris-api:v1
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: iris-api
spec:
  selector: {app: iris-api}
  ports: [{port: 80, targetPort: 8080}]
